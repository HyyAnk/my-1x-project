<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bgGrad_1_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e26"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c17"/>
    </linearGradient>
    <linearGradient id="badgeGrad_1_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow_1_1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_1_1" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="shadow_1_1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="640" height="640" fill="url(#bgGrad_1_1)"/>
  <rect width="640" height="640" fill="url(#grid_1_1)"/>
  <circle cx="320" cy="320" r="280" fill="url(#glow_1_1)"/>

  <!-- Safe Area Guides -->
  <rect x="51" y="51" width="538" height="538" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="67" y="79" fill="rgba(255,255,255,0.35)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SAFE AREA (85%)</text>

  <!-- Alignment Crosshairs -->
  <path d="M 296 320 L 344 320 M 320 296 L 320 344" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Corner Crop Marks -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M 620 40 L 620 20 L 600 20" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M 20 600 L 20 620 L 40 620" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M 620 600 L 620 620 L 600 620" fill="none" stroke="#10b981" stroke-width="3"/>

  <!-- Center Specimen Card -->
  <rect x="70" y="195" width="500" height="250" rx="24" fill="rgba(6, 46, 38, 0.85)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="url(#shadow_1_1)"/>

  <!-- Specimen Badge Pill -->
  <g transform="translate(320, 249)">
    <rect x="-95" y="-20" width="190" height="40" rx="20" fill="url(#badgeGrad_1_1)"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">1:1 RATIO</text>
  </g>

  <!-- Dimension Metric -->
  <text x="320" y="322" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">640 × 640 px</text>

  <!-- Role Subtitle -->
  <text x="320" y="358" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Choice Card / Visual Option</text>

  <!-- Dimensions Indicator Edge Markers -->
  <text x="320" y="626" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">WIDTH: 640px</text>
  <text x="16" y="320" text-anchor="middle" transform="rotate(-90 16 320)" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">HEIGHT: 640px</text>
</svg>
