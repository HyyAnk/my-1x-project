<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 810" width="1080" height="810">
  <defs>
    <linearGradient id="bgGrad_4_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#0c0717"/>
    </linearGradient>
    <linearGradient id="badgeGrad_4_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow_4_3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_4_3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="shadow_4_3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="810" fill="url(#bgGrad_4_3)"/>
  <rect width="1080" height="810" fill="url(#grid_4_3)"/>
  <circle cx="540" cy="405" r="360" fill="url(#glow_4_3)"/>

  <!-- Safe Area Guides -->
  <rect x="86" y="65" width="908" height="680" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="102" y="93" fill="rgba(255,255,255,0.35)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">SAFE AREA (85%)</text>

  <!-- Alignment Crosshairs -->
  <path d="M 516 405 L 564 405 M 540 381 L 540 429" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Corner Crop Marks -->
  <path d="M 24 48 L 24 24 L 48 24" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 1056 48 L 1056 24 L 1032 24" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 24 762 L 24 786 L 48 786" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 1056 762 L 1056 786 L 1032 786" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- Center Specimen Card -->
  <rect x="260" y="275" width="560" height="260" rx="24" fill="rgba(24, 14, 41, 0.85)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="url(#shadow_4_3)"/>

  <!-- Specimen Badge Pill -->
  <g transform="translate(540, 329)">
    <rect x="-105" y="-22" width="210" height="44" rx="22" fill="url(#badgeGrad_4_3)"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="0.5">4:3 RATIO</text>
  </g>

  <!-- Dimension Metric -->
  <text x="540" y="403" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">1080 × 810 px</text>

  <!-- Role Subtitle -->
  <text x="540" y="439" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Question Media / Clue Deduction</text>

  <!-- Dimensions Indicator Edge Markers -->
  <text x="540" y="792" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">WIDTH: 1080px</text>
  <text x="18" y="405" text-anchor="middle" transform="rotate(-90 18 405)" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">HEIGHT: 810px</text>
</svg>
